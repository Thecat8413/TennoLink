name: Build & Release TennoRelicSync

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-tray-agent:
    name: Build Native Windows System Tray Companion
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: companion/go.sum

      - name: Build Windows Executable
        run: |
          cd companion
          go mod tidy
          # -H=windowsgui compiles as a native GUI application (no flashing command prompt)
          # -s -w strips debug symbols to minimize file size (~5MB)
          go build -ldflags="-H=windowsgui -s -w" -o ../TennoRelicSync.exe .

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TennoRelicSync-Windows-x64
          path: TennoRelicSync.exe
          if-no-files-found: error

      - name: Publish to GitHub Releases (On Version Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: TennoRelicSync.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
