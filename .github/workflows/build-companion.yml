name: Build & Release TennoLink

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths:
      - 'companion-cs/**'
      - '.github/workflows/build-companion.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'companion-cs/**'
      - '.github/workflows/build-companion.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tray-agent:
    name: Build Native Windows System Tray Companion
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Windows Executable
        run: |
          cd companion-cs
          dotnet publish -c Release -r win-x64 --self-contained true -o ../publish
          Move-Item -Path ../publish/TennoLink.exe -Destination ../TennoLink.exe -Force
          Compress-Archive -Path ../TennoLink.exe -DestinationPath ../TennoLink.zip -Force

      - name: Compile Inno Setup Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" companion-cs\TennoLink.iss

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TennoLink-Windows-x64
          path: |
            TennoLink.exe
            TennoLink.zip
            TennoLink-Setup.exe
          if-no-files-found: error

      - name: Publish to GitHub Releases (Continuous Latest)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Companion Build
          files: |
            TennoLink.exe
            TennoLink.zip
            TennoLink-Setup.exe
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
