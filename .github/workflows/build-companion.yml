name: Build & Release TennoRelicSync

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-tray-agent:
    name: Build Native Windows System Tray Companion
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Windows Executable
        run: |
          cd companion-cs
          dotnet publish -c Release -r win-x64 --self-contained true -o ../publish
          Move-Item -Path ../publish/TennoRelicSync.exe -Destination ../TennoRelicSync.exe

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TennoRelicSync-Windows-x64
          path: TennoRelicSync.exe
          if-no-files-found: error

      - name: Publish to GitHub Releases (On Version Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: TennoRelicSync.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
