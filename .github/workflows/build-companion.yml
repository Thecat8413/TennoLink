name: Build & Release TennoRelicSync

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tray-agent:
    name: Build Native Windows System Tray Companion
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Windows Executable
        run: |
          cd companion-cs
          dotnet publish -c Release -r win-x64 --self-contained true -o ../publish
          Move-Item -Path ../publish/TennoRelicSync.exe -Destination ../TennoRelicSync.exe -Force
          Compress-Archive -Path ../TennoRelicSync.exe -DestinationPath ../TennoRelicSync.zip -Force

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TennoRelicSync-Windows-x64
          path: |
            TennoRelicSync.exe
            TennoRelicSync.zip
          if-no-files-found: error

      - name: Publish to GitHub Releases (Continuous Latest)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Companion Build
          files: |
            TennoRelicSync.exe
            TennoRelicSync.zip
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
